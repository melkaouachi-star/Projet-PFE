                <h4>{c.title}</h4>
                <p>{c.body}</p>
              </div>
            ))}
          </section>
        </div>
      );
    }

    /* ===== Simulation Control ===== */
    function Simulation({ rate, setRate, fraudRatio, setFraudRatio, status, startSim, stopSim, seedCustomers, injectScenario, decisions }) {
      const scenarios = [
        ["normal", "Normal traffic", "activity"],
        ["high_amount", "High amount", "trending-up"],
        ["night_transaction", "Night fraud", "moon"],
        ["foreign_country", "Foreign IP", "globe"],
        ["impossible_travel", "Impossible travel", "plane"],
        ["rapid_transaction_burst", "Stolen card burst", "zap"],
        ["stolen_card_behavior", "Stolen card", "credit-card"],
        ["bot_generated_fraud", "Bot attack", "bot"],
        ["multiple_transactions_different_ips", "Multi-IP", "network"],
        ["account_takeover", "Account takeover", "user-x"],
        ["anomalous_spending_pattern", "Anomalous spend", "alert-octagon"],
      ];
      return (
        <div className="stack">
          <section className="hero">
            <div>
              <h2>Simulation Control Center</h2>
              <p>Drive the fraud simulator at production-realistic rates, inject specific attack scenarios and watch the engine respond live. Useful for thesis demos, training analysts and validating threshold choices.</p>
            </div>
            <div className="hero-stats">
              <div className="hero-stat"><div className="hero-stat-label">Status</div><div className="hero-stat-val">{status.running ? "Running" : "Idle"}</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Rate</div><div className="hero-stat-val">{status.rate_tps || rate} TPS</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Fraud ratio</div><div className="hero-stat-val">{Number(status.fraud_ratio ?? fraudRatio).toFixed(2)}</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Generated</div><div className="hero-stat-val">{(status.generated || 0).toLocaleString()}</div></div>
            </div>
          </section>

          <section className="panel">
            <div className="panel-head"><div className="panel-title"><i data-lucide="settings-2" size="15"></i>Controls</div></div>
            <div className="panel-body">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end" }}>
                <div>
                  <div className="muted" style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", marginBottom: 6 }}>Transaction rate</div>
                  <select className="select" value={rate} onChange={e => setRate(e.target.value)} style={{ width: 160 }}>
                    <option value="10">10 transactions / sec</option>
                    <option value="100">100 transactions / sec</option>
                    <option value="1000">1000 transactions / sec</option>
                  </select>
                </div>
                <div>
                  <div className="muted" style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", marginBottom: 6 }}>Fraud ratio</div>
                  <input className="input" type="number" min="0" max="1" step="0.01" value={fraudRatio}
                    onChange={e => setFraudRatio(e.target.value)} style={{ width: 120 }} />
                </div>
                <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
                  <button className="btn good" onClick={startSim}><i data-lucide="play" size="14"></i>Start</button>
                  <button className="btn danger" onClick={stopSim}><i data-lucide="square" size="14"></i>Stop</button>
                  <button className="btn" onClick={seedCustomers}><i data-lucide="users" size="14"></i>Seed 5000 customers</button>
                </div>
              </div>
            </div>
            <div className="panel-foot">
              <span className={"status-dot " + (status.running ? "live" : "")} style={{ display: "inline-block", marginRight: 8, verticalAlign: "middle" }}></span>
              {status.running ? "Simulator is live — transactions stream via WebSocket / SSE." : "Simulator idle — press Start to begin live scoring."}
            </div>
          </section>

          <section className="sim-grid">
            <div className="sim-stat"><div className="sim-stat-val">{(status.generated || 0).toLocaleString()}</div><div className="sim-stat-label">Generated</div></div>
            <div className="sim-stat"><div className="sim-stat-val">{(decisions.BLOCKED || 0).toLocaleString()}</div><div className="sim-stat-label">Detected frauds</div></div>
            <div className="sim-stat"><div className="sim-stat-val">{(decisions.SUSPICIOUS || 0).toLocaleString()}</div><div className="sim-stat-label">Review queue</div></div>
            <div className="sim-stat"><div className="sim-stat-val">{(decisions.APPROVED || 0).toLocaleString()}</div><div className="sim-stat-label">Approved</div></div>
          </section>

          <section className="panel">
            <div className="panel-head"><div className="panel-title"><i data-lucide="target" size="15"></i>Inject attack scenario</div></div>
            <div className="panel-body">
              <div className="grid-4">
                {scenarios.map(([id, label, icon]) => (
                  <button className="ctx-card" key={id} onClick={() => injectScenario(id)} style={{ cursor: "pointer", textAlign: "left", border: "1px solid var(--line)" }}>
                    <div className="ico"><i data-lucide={icon} size="16"></i></div>
                    <h4>{label}</h4>
                    <p>One-shot injection of the <span className="mono">{id}</span> scenario, scored end-to-end.</p>
                  </button>
                ))}
              </div>
            </div>
            <div className="panel-foot">Each click samples one transaction matching the scenario, scores it through <span className="mono">/predict</span> and pushes the result into the live feed.</div>
          </section>
        </div>
      );
    }
    function SimStat({ label, value }) {
      return <div className="sim-stat"><div className="sim-stat-val">{value}</div><div className="sim-stat-label">{label}</div></div>;
    }

    /* ===== SHAP / Explainability ===== */
    function ShapPage({ selected, events, setSelected }) {
      const reasons = selected?.risk_contribution_score || selected?.dynamic_features || {};
      const reasonList = Object.entries(reasons).slice(0, 10);
      const explanationSentence = selected ? buildExplanation(selected, reasonList) : "Select a transaction to see its decision rationale.";
      return (
        <div className="stack">
          <section className="grid-2">
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title"><i data-lucide="brain-circuit" size="15"></i>Local explanation</div>
                <span className="muted mono" style={{ fontSize: 11 }}>{selected?.transaction_id || "no transaction"}</span>
              </div>
              <div className="panel-body">
                {!selected ? (
                  <div className="empty"><i data-lucide="brain" size="32"></i><div>Select a live transaction.</div></div>
                ) : (
                  <>
                    <div className="alert-row" style={{ marginBottom: 10 }}>
                      <div>
                        <strong style={{ fontSize: 15 }}>{selected.customer_name}</strong>
                        <div className="muted" style={{ fontSize: 12 }}>{selected.fraud_level || ""} · fraud {pct(selected.fraud_probability)}</div>
                      </div>
                      <Badge value={decisionOf(selected)} />
                    </div>
                    <div style={{ padding: 14, background: "rgba(59,130,246,.08)", border: "1px solid rgba(59,130,246,.22)", borderRadius: 12, fontSize: 13, lineHeight: 1.6, color: "var(--ink-2)" }}>
                      <strong style={{ color: "var(--blue-2)" }}>Why this decision: </strong>{explanationSentence}
                    </div>
                    <div className="divider" style={{ margin: "16px 0" }}></div>
                    <div style={{ marginBottom: 8, fontSize: 12, fontWeight: 600, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".07em" }}>Risk contributions</div>
                    {reasonList.length === 0 && <div className="muted">No risk-contribution payload available.</div>}
                    {reasonList.map(([name, detail]) => {
                      const v = Number(detail.risk_points || 0);
                      return (
                        <div className="shap-row" key={name}>
                          <span className="name">{name.replaceAll("_", " ")}</span>
                          <div className={"shap-bar " + (v >= 0 ? "" : "pos")}><span style={{ width: `${Math.min(100, Math.abs(v))}%` }}></span></div>
                          <span className="val">{v >= 0 ? "+" : ""}{v.toFixed(0)}</span>
                        </div>
                      );
                    })}
                  </>
                )}
              </div>
              <div className="panel-foot">Per-feature risk points are persisted by the real-time engine and exposed via <span className="mono">/shap-explanation</span>.</div>
            </div>

            <div className="stack">
              <div className="panel">
                <div className="panel-head"><div className="panel-title"><i data-lucide="layers-3" size="15"></i>Global SHAP deliverables</div></div>
                <div className="panel-body" style={{ fontSize: 13, lineHeight: 1.65, color: "var(--ink-2)" }}>
                  The offline explainability module supports SHAP summary, waterfall and dependence plots for tree-based models. The real-time engine persists local SHAP-style contributions for every scored transaction and exposes them through <span className="mono">/shap-explanation</span> and <span className="mono">/api/v1/export/shap-summary.csv</span>.
                </div>
              </div>
              <div className="panel">
                <div className="panel-head">
                  <div className="panel-title"><i data-lucide="rewind" size="15"></i>Switch transaction</div>
                  <span className="muted">{events.length} available</span>
                </div>
                <div className="panel-body alerts" style={{ maxHeight: 320 }}>
                  {events.slice(0, 30).map(e => (
                    <div className={"alert-item " + (decisionOf(e) === "BLOCKED" ? "HIGH" : decisionOf(e) === "SUSPICIOUS" ? "MEDIUM" : "LOW")}
                      key={e.transaction_id} onClick={() => setSelected(e)} style={{ cursor: "pointer" }}>
                      <div className="alert-row">
                        <strong>{e.customer_name || "-"}</strong>
                        <Badge value={decisionOf(e)} />
                      </div>
                      <div className="alert-line">{fmtMoney(amountOf(e), currencyOf(e))} · {e.city}, {e.country}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    }
    function buildExplanation(tx, reasons) {
      const top = reasons.slice(0, 3).map(([n]) => n.replaceAll("_", " "));
      const decision = decisionOf(tx);
      if (decision === "APPROVED") return `Approved — risk profile is consistent with the customer baseline; no critical drivers above threshold.`;
      const verb = decision === "BLOCKED" ? "blocked" : "flagged for review";
      const lead = top.length ? `the engine detected unusual ${top.join(", ")}` : `aggregate risk exceeded the operating threshold`;
      return `This transaction was ${verb} because ${lead}, producing a fraud probability of ${pct(tx.fraud_probability)} and a risk score of ${Math.round(tx.risk_score || 0)}.`;
    }

    /* ===== Power BI Export ===== */
    function ExportPage({ exportsInfo }) {
      const items = exportsInfo?.items || [];
      const fallback = [
        { name: "model_benchmark_results.csv", endpoint: "/api/v1/export/model-benchmark.csv", available: true, rows: null },
        { name: "live_transactions.csv", endpoint: "/api/v1/export/transactions.csv", available: true, rows: null },
        { name: "fraud_alerts.csv", endpoint: "/api/v1/export/fraud-alerts.csv", available: true, rows: null },
        { name: "cost_analysis.csv", endpoint: "/api/v1/export/cost-analysis.csv", available: true, rows: null },
        { name: "threshold_optimization.csv", endpoint: "/api/v1/export/threshold-optimization.csv", available: true, rows: null },
        { name: "shap_summary.csv", endpoint: "/api/v1/export/shap-summary.csv", available: true, rows: null },
        { name: "customers.csv", endpoint: "/api/v1/export/customers.csv", available: true, rows: null },
        { name: "simulation_summary.csv", endpoint: "/api/v1/export/simulation-summary.csv", available: true, rows: null },
      ];
      const datasets = items.length ? items : fallback;
      return (
        <div className="stack">
          <section className="hero">
            <div>
              <h2>Power BI Integration</h2>
              <p>Connect Power BI directly to PostgreSQL or consume the CSV bundle below. Required reporting datasets cover live transactions, fraud alerts, cost analysis, threshold optimisation, model benchmarking, best model metrics, simulation summary and SHAP feature importance.</p>
            </div>
            <div className="hero-stats">
              <div className="hero-stat"><div className="hero-stat-label">Datasets</div><div className="hero-stat-val">{datasets.length}</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Bundle</div><div className="hero-stat-val">powerbi.zip</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Auth</div><div className="hero-stat-val">Public read</div></div>
              <div className="hero-stat"><div className="hero-stat-label">Last refresh</div><div className="hero-stat-val">{exportsInfo?.generated_at ? fmtShortTime(exportsInfo.generated_at) : "live"}</div></div>
            </div>
          </section>

          <section className="toolbar">
            <div className="muted">Use the bundle for offline analysis or pull individual CSVs into Power BI / Excel / Tableau.</div>
            <div style={{ display: "flex", gap: 8 }}>
              <a className="btn" href="/api/v1/export/inventory"><i data-lucide="list" size="14"></i>Inventory JSON</a>
              <a className="btn primary" href="/api/v1/export/powerbi.zip"><i data-lucide="download" size="14"></i>Download full ZIP</a>
            </div>
          </section>

          <section className="grid-2">
            {datasets.map(d => (
              <div className="export-tile" key={d.name}>
                <div className="left">
                  <div className="export-ico"><i data-lucide="file-spreadsheet" size="18"></i></div>
                  <div>
                    <div className="export-name">{d.name}</div>
                    <div className="export-sub">{d.endpoint} {d.rows != null && <> · {fmtCompact(d.rows)} rows</>}</div>
                  </div>
                </div>
                <a className="btn primary sm" href={d.endpoint}><i data-lucide="download" size="13"></i>CSV</a>
              </div>
            ))}
          </section>

          <section className="panel">
            <div className="panel-head"><div className="panel-title"><i data-lucide="info" size="15"></i>How to wire Power BI</div></div>
            <div className="panel-body" style={{ fontSize: 13, lineHeight: 1.7, color: "var(--ink-2)" }}>
              <ol style={{ margin: 0, paddingLeft: 18 }}>
                <li>Download <span className="mono">powerbi.zip</span> or connect Power BI to the PostgreSQL instance.</li>
                <li>Build pages around <span className="mono">model_benchmark_results.csv</span>, <span className="mono">cost_analysis.csv</span> and <span className="mono">threshold_optimization.csv</span>.</li>
                <li>Cross-filter alerts and SHAP contributions by customer / country / merchant for analyst workflows.</li>
                <li>Schedule daily refresh; the FastAPI export endpoints support polling without authentication for internal use.</li>
              </ol>
            </div>
          </section>
        </div>
      );
    }

    /* ===== Hotspots ===== */
    function TopLists({ analytics }) {
      const countries = (analytics.top_countries || []).slice(0, 5);
      const scenarios = (analytics.scenarios || []).slice(0, 5);
      return (
        <div className="panel">
          <div className="panel-head"><div className="panel-title"><i data-lucide="flame" size="15"></i>Hotspots & scenarios</div></div>
          <div className="panel-body stack">
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".07em", marginBottom: 8 }}>Top countries</div>
              {countries.length === 0 && <div className="muted" style={{ fontSize: 13 }}>Waiting for traffic.</div>}
              {countries.map(c => (
                <div className="alert-row" key={c.country} style={{ padding: "6px 0" }}>
                  <span style={{ fontSize: 13 }}><i data-lucide="map-pin" size="13" style={{ marginRight: 6, color: "var(--blue-2)" }}></i>{c.country}</span>
                  <strong>{c.count}</strong>
                </div>
              ))}
            </div>
            <div className="divider"></div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".07em", marginBottom: 8 }}>Active scenarios</div>
              {scenarios.length === 0 && <div className="muted" style={{ fontSize: 13 }}>Inject a scenario from the Simulation Control center.</div>}
              {scenarios.map(s => (
                <div className="alert-row" key={s.scenario} style={{ padding: "6px 0" }}>
                  <span style={{ fontSize: 13 }}><i data-lucide="zap" size="13" style={{ marginRight: 6, color: "var(--orange)" }}></i>{s.scenario.replaceAll("_", " ")}</span>
                  <strong>{s.count}</strong>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ===== Map ===== */
    function FraudMap({ events, setModalTx }) {
      const ref = useRef(null); const layer = useRef(null);
      useEffect(() => {
        if (!window.L || ref.current) return;
        ref.current = L.map("map", { zoomControl: false, attributionControl: false }).setView([24, 0], 2);
        L.control.zoom({ position: "bottomright" }).addTo(ref.current);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(ref.current);
        layer.current = L.layerGroup().addTo(ref.current);
      }, []);
      useEffect(() => {
        if (!layer.current) return;
        layer.current.clearLayers();
        events.slice(0, 250).forEach(e => {
          if (!e.latitude || !e.longitude) return;
          const decision = decisionOf(e);
          const color = decision === "BLOCKED" ? "#ef4444" : decision === "SUSPICIOUS" ? "#f59e0b" : "#22c55e";
          const marker = L.circleMarker([e.latitude, e.longitude], { radius: decision === "BLOCKED" ? 10 : 6, color, fillColor: color, fillOpacity: .7, weight: 2 });
          marker.bindPopup(`<strong>${e.customer_name || ""}</strong><br>${fmtMoney(amountOf(e), currencyOf(e))}<br>${e.city || ""}, ${e.country || ""}<br>Risk ${Math.round(e.risk_score || 0)}`);
          marker.on("click", () => setModalTx && setModalTx(e));
          marker.addTo(layer.current);
        });
      }, [events, setModalTx]);
      return <div id="map"></div>;
    }

    /* ===== Cost tables ===== */
    function CostTable({ rows, currency }) {
      return (
        <div className="table-wrap">
          <div className="panel-head"><div className="panel-title"><i data-lucide="table" size="15"></i>Cost comparison</div></div>
          <div className="table-scroll">
            <table>
              <thead><tr>
                <th>Strategy</th><th style={{ textAlign: "right" }}>Threshold</th>
                <th style={{ textAlign: "right" }}>FN</th><th style={{ textAlign: "right" }}>FP</th>
                <th style={{ textAlign: "right" }}>Fraud loss</th><th style={{ textAlign: "right" }}>FP cost</th>
                <th style={{ textAlign: "right" }}>Total cost</th><th style={{ textAlign: "right" }}>F1</th>
                <th style={{ textAlign: "right" }}>MCC</th><th style={{ textAlign: "right" }}>Savings</th>
              </tr></thead>
              <tbody>
                {(rows || []).map(r => (
                  <tr key={r.strategy}>
                    <td style={{ fontWeight: 600 }}>{r.strategy}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.threshold).toFixed(2)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.fn}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.fp}</td>
                    <td style={{ textAlign: "right" }}>{fmtMoney(r.fraud_loss, currency)}</td>
                    <td style={{ textAlign: "right" }}>{fmtMoney(r.fp_cost, currency)}</td>
                    <td style={{ textAlign: "right", fontWeight: 600 }}>{fmtMoney(r.total_cost, currency)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.f1).toFixed(3)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.mcc).toFixed(3)}</td>
                    <td style={{ textAlign: "right", color: Number(r.savings_vs_default) > 0 ? "var(--green)" : "var(--ink)" }}>{fmtMoney(r.savings_vs_default, currency)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    function SweepTable({ rows, currency }) {
      return (
        <div className="table-wrap">
          <div className="panel-head"><div className="panel-title"><i data-lucide="table" size="15"></i>Threshold sweep 0.01 – 0.99</div></div>
          <div className="table-scroll" style={{ maxHeight: 480 }}>
            <table>
              <thead><tr>
                <th>Threshold</th><th style={{ textAlign: "right" }}>TP</th><th style={{ textAlign: "right" }}>TN</th>
                <th style={{ textAlign: "right" }}>FP</th><th style={{ textAlign: "right" }}>FN</th>
                <th style={{ textAlign: "right" }}>Precision</th><th style={{ textAlign: "right" }}>Recall</th>
                <th style={{ textAlign: "right" }}>F1</th><th style={{ textAlign: "right" }}>MCC</th>
                <th style={{ textAlign: "right" }}>Total cost</th>
              </tr></thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.threshold}>
                    <td className="mono" style={{ fontWeight: 600 }}>{Number(r.threshold).toFixed(2)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.tp}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.tn}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.fp}</td>
                    <td style={{ textAlign: "right" }} className="mono">{r.fn}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.precision).toFixed(3)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.recall).toFixed(3)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.f1).toFixed(3)}</td>
                    <td style={{ textAlign: "right" }} className="mono">{Number(r.mcc).toFixed(3)}</td>
                    <td style={{ textAlign: "right" }}>{fmtMoney(r.total_cost, currency)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    function EmptyCost() {
      return (
        <div className="panel">
          <div className="panel-body empty">
            <i data-lucide="calculator" size="36"></i>
            <div style={{ marginTop: 10, fontWeight: 600, color: "var(--ink-2)" }}>No cost analysis loaded yet</div>
            <div style={{ marginTop: 6 }}>Start the simulator until both normal and fraudulent transactions exist, then click <strong>Compute</strong> to generate the live cost curve.</div>
          </div>
        </div>
      );
    }

    /* ===== Helpers ===== */
    function countDecisions(events) { return events.reduce((a, e) => { const d = decisionOf(e); a[d] = (a[d] || 0) + 1; return a; }, { APPROVED: 0, SUSPICIOUS: 0, REVIEW: 0, BLOCKED: 0 }); }
    function riskBuckets(events) {
      const b = [0, 0, 0, 0]; events.forEach(e => { const s = Number(e.risk_score || 0); if (s < 45) b[0]++; else if (s < 70) b[1]++; else if (s < 85) b[2]++; else b[3]++; }); return b;
    }
    function timeline(events) {
      const map = {}; events.forEach(e => {
        const d = new Date(e.timestamp || e.created_at);
        const k = Number.isNaN(d.getTime()) ? "now" : d.toISOString().slice(11, 16);
        map[k] = (map[k] || 0) + 1;
      });
      return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0])).slice(-24).map(([label, count]) => ({ label, count }));
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
