services:
  db:
    image: postgres:16
    container_name: fraud-db
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fraud-api
    environment:
      - DATABASE_URL=postgresql+psycopg2://fraud:fraud@db:5432/fraud_db
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: fraud-dashboard
    environment:
      - DASHBOARD_API_BASE_URL=http://api:8000
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started

volumes:
  fraud_pgdata:
