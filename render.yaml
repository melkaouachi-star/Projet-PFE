# Render Blueprint
#
# This blueprint deploys the current live platform as one web service:
#   - FastAPI REST API
#   - WebSocket/SSE live stream
#   - Static React dashboard served by FastAPI at /dashboard
#   - Managed PostgreSQL database
#
# Render will inject PORT automatically. scripts/run_api.py reads PORT and
# binds Uvicorn to 0.0.0.0 so the service is reachable from the internet.

databases:
  - name: fraud-db
    plan: free
    databaseName: fraud_db
    user: fraud

services:
  - type: web
    name: fraud-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_SHAP
        value: "0"
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
